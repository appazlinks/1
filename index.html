<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>azlinks</title>
    <!-- Favicon Moderno -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><path d='M30 50l20-20v15h20v10H50v15z' fill='%23ffffff'/><circle cx='70' cy='70' r='8' fill='%2360a5fa'/></svg>">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="azlinks-192x192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f3f3f3; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cdcdcd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a6a6a6; }

        .category-scroll {
            max-height: calc(100dvh - 140px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .safe-bottom-padding {
            padding-bottom: calc(env(safe-area-inset-bottom) + 5rem);
        }

        footer {
            padding-bottom: max(0.625rem, env(safe-area-inset-bottom));
        }

        @media (min-width: 768px) {
            .desktop-logo-text { font-size: 32px !important; }
            .desktop-logo-svg { width: 190px !important; height: 46px !important; }
            .category-scroll { max-height: calc(100vh - 100px); }
            .safe-bottom-padding { padding-bottom: 2rem; }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] min-h-[100dvh] font-sans overflow-hidden text-slate-800">

    <!-- Barra Superior -->
    <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 p-3 flex flex-col items-start md:items-stretch gap-3 shadow-sm z-20 shrink-0">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <div class="flex items-center cursor-pointer select-none shrink-0 self-center" onclick="window.location.reload()">
                    <svg class="desktop-logo-svg" width="140" height="34" viewBox="0 0 180 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="#2563EB"/>
                        <path d="M12 28L20 14L28 28H23.5L20 21.5L16.5 28H12Z" fill="white"/>
                        <path d="M15 25H25" stroke="white" stroke-width="2"/>
                        <text class="desktop-logo-text" x="48" y="28" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#1E293B">AZ<tspan fill="#2563EB">Links</tspan></text>
                    </svg>
                </div>
            </div>

            <!-- Botões Desktop -->
            <div class="hidden md:flex items-center gap-2 shrink-0">
                <!-- Dropdown Links -->
                <div class="relative">
                    <button onclick="toggleDropdown('backupDropdownDesk')" class="px-2.5 py-1.5 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 transition-all flex items-center gap-1.5 font-medium">
                        <i class="fa-solid fa-database text-blue-600"></i> 
                        <span>Links</span>
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </button>
                    <div id="backupDropdownDesk" class="absolute right-0 mt-1 w-40 bg-white border border-gray-200 rounded-md shadow-lg hidden z-30 py-1">
                        <button onclick="exportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-download text-gray-400"></i> Exportar</button>
                        <button onclick="triggerImportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-upload text-gray-400"></i> Importar</button>
                        <button onclick="confirmClearAllShortcuts(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-trash text-red-500"></i> Remover Todos</button>
                    </div>
                </div>

                <!-- Dropdown Visualização -->
                <div class="relative">
                    <button onclick="toggleDropdown('viewDropdownDesk')" class="px-2.5 py-1.5 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 transition-all flex items-center gap-1.5 font-medium">
                        <i class="fa-solid fa-eye text-blue-600"></i> 
                        <span>Visualização</span>
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </button>
                    <div id="viewDropdownDesk" class="absolute right-0 mt-1 w-36 bg-white border border-gray-200 rounded-md shadow-lg hidden z-30 py-1">
                        <button onclick="setViewMode('grid'); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-border-all text-gray-400"></i> Grade</button>
                        <button onclick="setViewMode('list'); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-list text-gray-400"></i> Lista</button>
                    </div>
                </div>

                <!-- Botão Atualizar / Sincronizar -->
                <button onclick="syncFromGoogleSheets()" title="Atualizar dados da planilha Google" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 hover:text-blue-600 transition-all flex items-center justify-center">
                    <i id="syncIconDesk" class="fa-solid fa-rotate-right"></i>
                </button>

                <button onclick="openModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-sm font-medium shadow-sm transition-all">
                    <i class="fa-solid fa-plus"></i> <span>Novo</span>
                </button>
            </div>
        </div>

        <!-- Barra de Pesquisa Desktop -->
        <div class="flex items-center justify-between w-full gap-2">
            <div class="hidden md:flex items-center gap-2 flex-1">
                <button onclick="toggleMobileSidebar()" title="Menu" class="p-2 text-gray-600 hover:text-blue-600 focus:outline-none rounded-md hover:bg-gray-100 transition-colors shrink-0">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInputDesktop" placeholder="Pesquisar atalhos..." 
                           class="w-full pl-9 pr-8 py-1.5 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all search-input">
                    <button onclick="clearSearch()" class="clear-search-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-sm"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Botões Mobile -->
            <div class="flex md:hidden items-center justify-between gap-1.5 w-full overflow-x-auto pb-1">
                <button onclick="openModal()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-md text-xs font-medium shrink-0"><i class="fa-solid fa-plus"></i> Novo</button>
                
                <div class="relative shrink-0">
                    <button onclick="toggleDropdown('backupDropdownMob')" class="px-2 py-1.5 text-xs rounded bg-gray-100 border text-gray-700 flex items-center gap-1 font-medium"><i class="fa-solid fa-database text-blue-600"></i> Links <i class="fa-solid fa-chevron-down text-[10px]"></i></button>
                    <div id="backupDropdownMob" class="absolute left-0 mt-1 w-40 bg-white border rounded-md shadow-lg hidden z-30 py-1">
                        <button onclick="exportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100"><i class="fa-solid fa-download"></i> Exportar</button>
                        <button onclick="triggerImportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100"><i class="fa-solid fa-upload"></i> Importar</button>
                        <button onclick="confirmClearAllShortcuts(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-gray-100"><i class="fa-solid fa-trash"></i> Remover Todos</button>
                    </div>
                </div>

                <div class="relative shrink-0">
                    <button onclick="toggleDropdown('viewDropdownMob')" class="px-2 py-1.5 text-xs rounded bg-gray-100 border text-gray-700 flex items-center gap-1 font-medium"><i class="fa-solid fa-eye text-blue-600"></i> Visualização <i class="fa-solid fa-chevron-down text-[10px]"></i></button>
                    <div id="viewDropdownMob" class="absolute left-0 mt-1 w-36 bg-white border rounded-md shadow-lg hidden z-30 py-1">
                        <button onclick="setViewMode('grid'); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100"><i class="fa-solid fa-border-all"></i> Grade</button>
                        <button onclick="setViewMode('list'); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100"><i class="fa-solid fa-list"></i> Lista</button>
                    </div>
                </div>

                <!-- Botão Atualizar Mobile -->
                <button onclick="syncFromGoogleSheets()" title="Atualizar dados" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:text-blue-600 transition-all flex items-center justify-center shrink-0">
                    <i id="syncIconMob" class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Barra de Pesquisa Mobile e Menu Hambúrguer -->
        <div class="flex md:hidden items-center gap-2 w-full">
            <button onclick="toggleMobileSidebar()" title="Menu" class="p-2 text-gray-600 hover:text-blue-600 focus:outline-none rounded-md hover:bg-gray-100 transition-colors shrink-0">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInputMobile" placeholder="Pesquisar atalhos..." 
                       class="w-full pl-9 pr-8 py-1.5 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all search-input">
                <button onclick="clearSearch()" class="clear-search-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Cabeçalho da Categoria -->
        <div class="flex items-center justify-between bg-white px-4 py-2 rounded-lg border border-gray-200/80 shadow-sm w-full">
            <h2 id="currentCategoryTitle" class="font-semibold text-gray-800 text-xs md:text-base flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-blue-600"></i> Todos os Atalhos
            </h2>
            <div class="flex items-center gap-2">
                <span id="syncIndicator" class="hidden text-[10px] text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 items-center gap-1">
                    <i class="fa-solid fa-sync fa-spin"></i> Sincronizando...
                </span>
                <span id="currentCategoryCount" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded-full">0 itens</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar / Menu Lateral -->
        <aside id="sidebar" onmouseenter="expandSidebar()" onmouseleave="collapseSidebar()" 
               class="fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 md:relative bg-gray-50/95 backdrop-blur-md border-r border-gray-200 p-3 flex flex-col justify-between transition-all duration-300 w-64 md:w-16 z-40 md:z-30 shadow-lg md:shadow-none">
            <div class="flex flex-col gap-1 w-full category-scroll pb-10 md:pb-0">
                <div class="flex items-center justify-between mb-2 px-1 border-b border-gray-200/60 pb-2 md:hidden">
                    <div id="sidebarTitle" class="text-xs font-bold text-gray-500 uppercase tracking-wider truncate">FILTROS</div>
                    <button onclick="toggleMobileSidebar()" class="text-gray-500 hover:text-gray-800 md:hidden p-1"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>
                <div id="categoryList" class="flex flex-col gap-1 mt-1"></div>
            </div>
        </aside>

        <div id="sidebarOverlay" onclick="collapseSidebar()" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

        <main class="flex-1 flex flex-col p-3 md:p-4 overflow-y-auto safe-bottom-padding gap-4">
            <div id="shortcutsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 xl:grid-cols-8 gap-3"></div>
            <div id="shortcutsList" class="hidden flex flex-col bg-white rounded-lg border border-gray-200 shadow-sm overflow-visible"></div>
            
            <div id="unregisteredNotice" class="hidden w-full border-2 border-red-500 rounded-lg p-6 flex flex-col items-center justify-center bg-white/50 my-4 text-center gap-2">
                <span class="text-red-500 font-semibold text-xl tracking-wide">Cópia não Registrada!</span>
                <span class="text-gray-700 font-medium text-sm">Entrar em contato com o desenvolvedor pelo whatsapp: 8298734-0685</span>
            </div>

            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center p-8 text-gray-400">
                <i class="fa-regular fa-folder-open text-5xl mb-3 text-gray-300"></i>
                <p class="text-base font-medium">Nenhum atalho encontrado</p>
            </div>
        </main>
    </div>

    <!-- Rodapé Fixo -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2.5 flex items-center justify-between text-xs text-gray-500 z-40 shadow-md md:relative">
        <div onclick="openPasswordModal()" class="flex items-center gap-2 truncate cursor-pointer hover:text-blue-600 transition-colors w-full justify-center md:justify-start">
            <i class="fa-solid fa-shield-halved text-blue-600 shrink-0"></i>
            <span class="truncate">Licenciado para: <strong id="footerLicenseName" class="text-gray-700">Sebastião Torquato</strong></span>
        </div>
    </footer>

    <input type="file" id="localFileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImportBackup(event)">

    <!-- Modais -->
    <div id="shortcutModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-file-code text-blue-600"></i> Adicionar Atalho</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="p-5 flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título do Atalho *</label>
                    <input type="text" id="shortcutTitle" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link ou URL *</label>
                    <input type="text" id="fileName" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria *</label>
                    <input type="text" id="shortcutCategory" list="categorySuggestions" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <datalist id="categorySuggestions"></datalist>
                </div>
                <div class="flex items-center gap-2 py-1">
                    <input type="checkbox" id="shortcutFavorite" class="w-4 h-4 text-amber-500 rounded border-gray-300">
                    <label for="shortcutFavorite" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1.5"><i class="fa-solid fa-star text-amber-400"></i> Favoritos</label>
                </div>
                <div class="flex items-center justify-end gap-2 mt-2 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Atalho -->
    <div id="editShortcutModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-pen text-blue-600"></i> Editar Atalho</h3>
                <button onclick="closeEditShortcutModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleEditFormSubmit(event)" class="p-5 flex flex-col gap-3">
                <input type="hidden" id="editOriginalId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título do Atalho *</label>
                    <input type="text" id="editShortcutTitle" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link ou URL *</label>
                    <input type="text" id="editFileName" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria *</label>
                    <input type="text" id="editShortcutCategory" required list="categorySuggestions" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex items-center gap-2 py-1">
                    <input type="checkbox" id="editShortcutFavorite" class="w-4 h-4 text-amber-500 rounded border-gray-300">
                    <label for="editShortcutFavorite" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1.5"><i class="fa-solid fa-star text-amber-400"></i> Favoritos</label>
                </div>
                <div class="flex items-center justify-end gap-2 mt-2 pt-3 border-t">
                    <button type="button" onclick="closeEditShortcutModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Remover Atalho -->
    <div id="deleteModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Confirmar Remoção</h3>
                <button onclick="closeDeleteModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <p id="deleteMessage" class="text-sm text-gray-600">Deseja remover este atalho?</p>
                <div class="flex items-center justify-end gap-2 pt-3 border-t">
                    <button type="button" onclick="closeDeleteModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                    <button type="button" id="confirmDeleteBtn" class="px-4 py-2 text-sm bg-red-600 hover:bg-red-700 text-white rounded-md font-medium">Remover</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNRHauds83by09v_Dq5wYROW87ycWqqf1mn48VeRi7MXCHyh0g4v6VtnEULq8_jpA/exec';

        function generateUniqueId() {
            return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        const defaultHtmlFiles = [
            { id: generateUniqueId(), title: 'g1', name: 'g1', file: 'https://g1.globo.com/', category: 'Notícias', customIcon: '', visitCount: 0, isFavorite: false },
            { id: generateUniqueId(), title: 'Gemini', name: 'Gemini', file: 'https://gemini.google.com/app', category: 'IA', customIcon: '', visitCount: true, isFavorite: true },
            { id: generateUniqueId(), title: 'Youtube', name: 'Youtube', file: 'https://www.youtube.com', category: 'Canais', customIcon: '', visitCount: 0, isFavorite: true }
        ];

        let htmlFiles = JSON.parse(localStorage.getItem('local_html_shortcuts')) || defaultHtmlFiles;
        let categoryCustomizations = JSON.parse(localStorage.getItem('local_category_customizations')) || {};
        let licensedTo = localStorage.getItem('local_app_license') || 'Sebastião Torquato';
        let currentCategory = 'all';
        let searchQuery = '';
        let categoryViewModes = JSON.parse(localStorage.getItem('local_category_view_modes')) || {};
        let sidebarOpen = false;
        let itemToDeleteId = null;

        const availableCategoryIcons = [
            { icon: 'fa-solid fa-house', color: 'text-amber-500' },
            { icon: 'fa-solid fa-cart-shopping', color: 'text-emerald-500' },
            { icon: 'fa-solid fa-brain', color: 'text-purple-500' },
            { icon: 'fa-solid fa-newspaper', color: 'text-blue-500' },
            { icon: 'fa-solid fa-video', color: 'text-red-500' },
            { icon: 'fa-solid fa-briefcase', color: 'text-indigo-500' },
            { icon: 'fa-solid fa-wrench', color: 'text-cyan-600' },
            { icon: 'fa-solid fa-users', color: 'text-pink-500' },
            { icon: 'fa-solid fa-star', color: 'text-amber-400' },
            { icon: 'fa-solid fa-code', color: 'text-teal-600' }
        ];

        const categoryKeywordMap = {
            'geral': 0, 'home': 0,
            'loja': 1, 'lojas': 1, 'compras': 1,
            'ia': 2, 'ai': 2, 'inteligência': 2,
            'noticia': 3, 'notícias': 3, 'news': 3,
            'canal': 4, 'canais': 4, 'video': 4, 'youtube': 4,
            'trabalho': 5, 'work': 5,
            'ferramenta': 6, 'ferramentas': 6,
            'social': 7, 'redes': 7,
            'favorito': 8, 'favoritos': 8,
            'dev': 9, 'programação': 9
        };

        function getCategoryIcon(catName) {
            if (!catName) return 'fa-solid fa-folder text-blue-500';
            if (catName === 'most_visited') return 'fa-solid fa-fire text-amber-500';
            if (catName === 'favorites') return 'fa-solid fa-star text-amber-400';

            if (categoryCustomizations[catName] && categoryCustomizations[catName].icon) {
                return categoryCustomizations[catName].icon;
            }

            const name = catName.trim().toLowerCase();
            if (name === 'todos') return 'fa-solid fa-border-all text-blue-600';
            
            for (let keyword in categoryKeywordMap) {
                if (name.includes(keyword)) {
                    const item = availableCategoryIcons[categoryKeywordMap[keyword]];
                    return `${item.icon} ${item.color}`;
                }
            }
            return 'fa-solid fa-folder text-blue-500';
        }

        async function syncToGoogleSheets() {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI') return;
            const indicator = document.getElementById('syncIndicator');
            if (indicator) indicator.classList.remove('hidden');
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ shortcuts: htmlFiles })
                });
            } catch (err) {
                console.error("Erro ao sincronizar envio:", err);
            } finally {
                if (indicator) indicator.classList.add('hidden');
            }
        }

        async function syncFromGoogleSheets() {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI') return;
            const indicator = document.getElementById('syncIndicator');
            const iconDesk = document.getElementById('syncIconDesk');
            const iconMob = document.getElementById('syncIconMob');
            
            if (indicator) indicator.classList.remove('hidden');
            if (iconDesk) iconDesk.classList.add('fa-spin');
            if (iconMob) iconMob.classList.add('fa-spin');

            try {
                const res = await fetch(APPS_SCRIPT_URL);
                const data = await res.json();
                if (data.status === "success" && Array.isArray(data.shortcuts) && data.shortcuts.length > 0) {
                    htmlFiles = data.shortcuts;
                    localStorage.setItem('local_html_shortcuts', JSON.stringify(htmlFiles));
                    render();
                }
            } catch (err) {
                console.error("Erro ao puxar dados do Sheets:", err);
            } finally {
                if (indicator) indicator.classList.add('hidden');
                if (iconDesk) iconDesk.classList.remove('fa-spin');
                if (iconMob) iconMob.classList.remove('fa-spin');
            }
        }

        function saveToStorage(forceSync = true) {
            localStorage.setItem('local_html_shortcuts', JSON.stringify(htmlFiles));
            localStorage.setItem('local_category_customizations', JSON.stringify(categoryCustomizations));
            if (forceSync) syncToGoogleSheets();
        }

        function openShortcut(url, itemId) {
            if (itemId) {
                const item = htmlFiles.find(f => f.id === itemId);
                if (item) {
                    item.visitCount = (item.visitCount || 0) + 1;
                    saveToStorage();
                }
            }
            window.open(url, '_blank');
        }

        function toggleFavorite(event, itemId) {
            event.stopPropagation();
            const item = htmlFiles.find(f => f.id === itemId);
            if (item) {
                item.isFavorite = !item.isFavorite;
                saveToStorage();
                render();
            }
        }

        // Configuração da Pesquisa
        const searchInputs = document.querySelectorAll('.search-input');
        const clearBtns = document.querySelectorAll('.clear-search-btn');
        
        searchInputs.forEach(input => {
            input.addEventListener('input', e => {
                searchQuery = e.target.value.toLowerCase();
                searchInputs.forEach(inp => inp.value = e.target.value);
                clearBtns.forEach(btn => btn.classList.toggle('hidden', searchQuery.length === 0));
                renderGrid();
            });
        });

        function clearSearch() { 
            searchQuery = ''; 
            searchInputs.forEach(inp => inp.value = '');
            clearBtns.forEach(btn => btn.classList.add('hidden')); 
            renderGrid(); 
        }

        function toggleMobileSidebar() { 
            sidebarOpen = !sidebarOpen; 
            applySidebarState(); 
        }

        function expandSidebar() { if(window.innerWidth >= 768) { sidebarOpen = true; applySidebarState(); } }
        function collapseSidebar() { sidebarOpen = false; applySidebarState(); }

        function applySidebarState() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const textElements = document.querySelectorAll('.sidebar-text');

            if (window.innerWidth >= 768) {
                if (sidebarOpen) {
                    sidebar.classList.replace('md:w-16', 'md:w-64');
                    textElements.forEach(el => el.classList.remove('md:hidden'));
                } else {
                    sidebar.classList.replace('md:w-64', 'md:w-16');
                    textElements.forEach(el => el.classList.add('md:hidden'));
                }
                overlay.classList.add('hidden');
            } else {
                if (sidebarOpen) {
                    sidebar.classList.replace('-translate-x-full', 'translate-x-0');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.replace('translate-x-0', '-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderGrid();
            if (window.innerWidth < 768) collapseSidebar();
        }

        function setViewMode(mode) {
            categoryViewModes[currentCategory] = mode;
            saveToStorage(false);
            renderGrid();
        }

        function getViewMode(cat) {
            return categoryViewModes[cat] || 'grid';
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const isHidden = el.classList.contains('hidden');
            closeAllDropdowns();
            if (isHidden) el.classList.remove('hidden');
        }

        function closeAllDropdowns() {
            ['backupDropdownDesk', 'viewDropdownDesk', 'backupDropdownMob', 'viewDropdownMob'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }

        function toggleActionMenu(event, menuId) {
            event.stopPropagation();
            const menu = document.getElementById(menuId);
            const isHidden = menu.classList.contains('hidden');
            closeAllActionMenus();
            if (isHidden) menu.classList.remove('hidden');
        }

        function closeAllActionMenus() {
            document.querySelectorAll('.action-menu-dropdown').forEach(m => m.classList.add('hidden'));
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.action-menu-container') && !e.target.closest('button[onclick*="toggleActionMenu"]')) {
                closeAllActionMenus();
            }
            if (!e.target.closest('button')) {
                closeAllDropdowns();
            }
        });

        function renderCategories() {
            const categoryList = document.getElementById('categoryList');
            if (!categoryList) return;
            categoryList.innerHTML = '';
            
            const uniqueCategories = new Set(htmlFiles.map(s => (s.category || 'Geral').trim()));
            const totalCategories = uniqueCategories.size;

            const createCatBtn = (label, iconClass, count, catVal, isSystem = true, catIndex = 0) => {
                const btn = document.createElement('button');
                btn.onclick = () => filterCategory(catVal);
                btn.className = `cat-btn flex items-center justify-between px-3 py-2 rounded-md text-sm w-full ${currentCategory === catVal ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-600 hover:bg-gray-100'}`;
                
                let actionMenuHtml = '';
                if (!isSystem) {
                    const catMenuId = `actionMenuCategory_${catIndex}`;
                    const isNearBottomCat = catIndex >= totalCategories - 2;
                    const catMenuPositionClass = isNearBottomCat ? 'absolute right-0 bottom-full mb-1' : 'absolute right-0 top-full mt-1';
                    
                    actionMenuHtml = `
                        <div class="flex items-center gap-1 shrink-0 relative action-menu-container">
                            <span class="sidebar-text md:hidden text-xs bg-gray-200/70 text-gray-600 px-2 py-0.5 rounded-full">${count}</span>
                            <button onclick="toggleActionMenu(event, '${catMenuId}')" title="Ações" class="sidebar-text md:hidden p-1.5 text-gray-400 hover:text-gray-600 rounded transition-colors">
                                <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                            </button>
                            <div id="${catMenuId}" class="action-menu-dropdown ${catMenuPositionClass} w-36 bg-white border border-gray-200 rounded-md shadow-xl hidden z-50 py-1 text-left">
                                <button onclick="event.stopPropagation(); editCategoryPrompt('${catVal.replace(/'/g, "\\'")}'); closeAllActionMenus();" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-100 flex items-center gap-2">
                                    <i class="fa-solid fa-pen text-blue-500"></i> Editar
                                </button>
                                <button onclick="event.stopPropagation(); deleteCategoryPrompt('${catVal.replace(/'/g, "\\'")}'); closeAllActionMenus();" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-gray-100 flex items-center gap-2">
                                    <i class="fa-solid fa-trash text-red-500"></i> Remover
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    actionMenuHtml = `<span class="sidebar-text md:hidden text-xs bg-gray-200/70 px-2 py-0.5 rounded-full">${count}</span>`;
                }

                btn.innerHTML = `
                    <span class="flex items-center gap-2 truncate flex-1 min-w-0">
                        <i class="${iconClass} shrink-0"></i>
                        <span class="sidebar-text md:hidden truncate">${label}</span>
                    </span>
                    ${actionMenuHtml}
                `;
                return btn;
            };

            categoryList.appendChild(createCatBtn('Favoritos', 'fa-solid fa-star text-amber-400', htmlFiles.filter(s => !!s.isFavorite).length, 'favorites', true));
            categoryList.appendChild(createCatBtn('Mais Visitados', 'fa-solid fa-fire text-amber-500', htmlFiles.filter(s => (s.visitCount || 0) > 0).length, 'most_visited', true));
            categoryList.appendChild(createCatBtn('Todos', 'fa-solid fa-border-all text-blue-600', htmlFiles.length, 'all', true));

            Array.from(uniqueCategories).sort().forEach((cat, index) => {
                const count = htmlFiles.filter(s => (s.category || 'Geral').trim() === cat).length;
                categoryList.appendChild(createCatBtn(cat, getCategoryIcon(cat), count, cat, false, index));
            });
        }

        function editCategoryPrompt(catName) {
            const newName = prompt("Novo nome para a categoria:", catName);
            if (newName && newName.trim() !== "") {
                htmlFiles.forEach(item => {
                    if ((item.category || 'Geral').trim() === catName) {
                        item.category = newName.trim();
                    }
                });
                if (currentCategory === catName) currentCategory = newName.trim();
                saveToStorage();
                render();
            }
        }

        function deleteCategoryPrompt(catName) {
            if (confirm(`Deseja remover a categoria "${catName}"? Os atalhos serão movidos para "Geral".`)) {
                htmlFiles.forEach(item => {
                    if ((item.category || 'Geral').trim() === catName) {
                        item.category = 'Geral';
                    }
                });
                if (currentCategory === catName) currentCategory = 'all';
                saveToStorage();
                render();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('shortcutsGrid');
            const list = document.getElementById('shortcutsList');
            const empty = document.getElementById('emptyState');
            const viewMode = getViewMode(currentCategory);
            if (!grid) return;

            let filtered = htmlFiles;
            if (searchQuery.length > 0) {
                filtered = htmlFiles.filter(s => (s.title && s.title.toLowerCase().includes(searchQuery)));
            } else {
                if (currentCategory === 'favorites') filtered = htmlFiles.filter(s => !!s.isFavorite);
                else if (currentCategory === 'most_visited') filtered = htmlFiles.filter(s => (s.visitCount || 0) > 0);
                else if (currentCategory !== 'all') filtered = htmlFiles.filter(s => (s.category || 'Geral').trim() === currentCategory);
            }

            document.getElementById('currentCategoryCount').textContent = `${filtered.length} itens`;

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                list.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            const totalItems = filtered.length;

            if (viewMode === 'grid') {
                list.classList.add('hidden');
                grid.classList.remove('hidden');
                grid.innerHTML = filtered.map((item, index) => {
                    const targetUrl = item.file || item.name;
                    const iconUrl = item.customIcon || `https://www.google.com/s2/favicons?domain=${new URL(targetUrl).hostname}&sz=128`;
                    const menuId = `actionMenuGrid_${index}`;
                    const isFav = !!item.isFavorite;

                    return `
                        <div class="group relative flex flex-col items-center justify-center p-3 rounded-lg cursor-pointer text-center bg-white border border-gray-200/80 hover:border-blue-300 hover:shadow-sm"
                             onclick="openShortcut('${targetUrl}', '${item.id}')">
                            
                            <button onclick="toggleFavorite(event, '${item.id}')" class="absolute top-1 left-1 p-1 text-gray-300 hover:text-amber-400 z-10">
                                <i class="fa-solid fa-star text-xs ${isFav ? 'text-amber-400' : ''}"></i>
                            </button>

                            <div class="w-10 h-10 mb-2 flex items-center justify-center">
                                <img src="${iconUrl}" class="w-8 h-8 object-contain" onerror="this.src='https://via.placeholder.com/32'">
                            </div>
                            <span class="text-xs text-gray-700 line-clamp-2 w-full font-medium">${item.title || item.name}</span>
                            
                            <div class="absolute top-1 right-1 action-menu-container z-10">
                                <button onclick="toggleActionMenu(event, '${menuId}')" title="Ações" class="p-1.5 text-gray-400 hover:text-gray-600 rounded transition-colors">
                                    <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                                </button>
                                <div id="${menuId}" class="action-menu-dropdown absolute top-full right-0 w-32 bg-white border rounded shadow-lg hidden z-50 py-1 text-left text-xs">
                                    <button onclick="event.stopPropagation(); openEditShortcutModal('${item.id}'); closeAllActionMenus();" class="w-full px-3 py-1 hover:bg-gray-100 flex items-center gap-2 text-gray-700"><i class="fa-solid fa-pen text-blue-500"></i> Editar</button>
                                    <button onclick="event.stopPropagation(); deleteItem('${item.id}'); closeAllActionMenus();" class="w-full px-3 py-1 hover:bg-gray-100 flex items-center gap-2 text-red-600"><i class="fa-solid fa-trash"></i> Remover</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                grid.classList.add('hidden');
                list.classList.remove('hidden');
                list.innerHTML = filtered.map((item, index) => {
                    const targetUrl = item.file || item.name;
                    const iconUrl = item.customIcon || `https://www.google.com/s2/favicons?domain=${new URL(targetUrl).hostname}&sz=128`;
                    const menuId = `actionMenuList_${index}`;
                    const isNearBottom = index >= totalItems - 2;
                    const menuPositionClass = isNearBottom ? 'absolute right-0 bottom-full mb-1' : 'absolute right-0 top-full mt-1';
                    const isFav = !!item.isFavorite;

                    return `
                        <div class="flex items-center justify-between px-4 py-2.5 hover:bg-gray-50 border-b border-gray-100 cursor-pointer transition-colors relative"
                             onclick="openShortcut('${targetUrl}', '${item.id}')">
                            <div class="flex items-center gap-3 min-w-0 flex-1">
                                <button onclick="toggleFavorite(event, '${item.id}')" class="p-1 text-gray-300 hover:text-amber-400">
                                    <i class="fa-solid fa-star text-xs ${isFav ? 'text-amber-400' : ''}"></i>
                                </button>
                                <div class="w-7 h-7 flex items-center justify-center bg-gray-100 rounded shrink-0">
                                    <img src="${iconUrl}" class="w-5 h-5 object-contain" onerror="this.src='https://via.placeholder.com/20'">
                                </div>
                                <div class="min-w-0 flex-1">
                                    <p class="text-xs font-medium text-gray-800 truncate">${item.title || item.name}</p>
                                    <p class="text-[10px] text-gray-400 truncate">${targetUrl}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0 action-menu-container">
                                <button onclick="toggleActionMenu(event, '${menuId}')" title="Ações" class="p-1.5 text-gray-400 hover:text-gray-600 rounded transition-colors">
                                    <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                                </button>
                                <div id="${menuId}" class="action-menu-dropdown ${menuPositionClass} w-32 bg-white border rounded shadow-lg hidden z-50 py-1 text-left text-xs">
                                    <button onclick="event.stopPropagation(); openEditShortcutModal('${item.id}'); closeAllActionMenus();" class="w-full px-3 py-1 hover:bg-gray-100 flex items-center gap-2 text-gray-700"><i class="fa-solid fa-pen text-blue-500"></i> Editar</button>
                                    <button onclick="event.stopPropagation(); deleteItem('${item.id}'); closeAllActionMenus();" class="w-full px-3 py-1 hover:bg-gray-100 flex items-center gap-2 text-red-600"><i class="fa-solid fa-trash"></i> Remover</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function openModal() { document.getElementById('shortcutModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('shortcutModal').classList.add('hidden'); }

        function openEditShortcutModal(itemId) {
            const item = htmlFiles.find(f => f.id === itemId);
            if (!item) return;
            document.getElementById('editOriginalId').value = item.id;
            document.getElementById('editShortcutTitle').value = item.title || item.name;
            document.getElementById('editFileName').value = item.file || item.name;
            document.getElementById('editShortcutCategory').value = item.category || 'Geral';
            document.getElementById('editShortcutFavorite').checked = !!item.isFavorite;
            document.getElementById('editShortcutModal').classList.remove('hidden');
        }

        function closeEditShortcutModal() { document.getElementById('editShortcutModal').classList.add('hidden'); }

        function handleEditFormSubmit(e) {
            e.preventDefault();
            const origId = document.getElementById('editOriginalId').value;
            const item = htmlFiles.find(f => f.id === origId);
            if (item) {
                item.title = document.getElementById('editShortcutTitle').value.trim();
                item.name = item.title;
                item.file = document.getElementById('editFileName').value.trim();
                item.category = document.getElementById('editShortcutCategory').value.trim() || 'Geral';
                item.isFavorite = document.getElementById('editShortcutFavorite').checked;
                saveToStorage();
            }
            closeEditShortcutModal();
            render();
        }

        function deleteItem(itemId) {
            const item = htmlFiles.find(f => f.id === itemId);
            if (!item) return;
            itemToDeleteId = itemId;
            document.getElementById('deleteMessage').textContent = `Deseja remover o atalho "${item.title || item.name}"?`;
            document.getElementById('confirmDeleteBtn').onclick = () => {
                htmlFiles = htmlFiles.filter(f => f.id !== itemToDeleteId);
                saveToStorage();
                closeDeleteModal();
                render();
            };
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); }

        function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('shortcutTitle').value.trim();
            const file = document.getElementById('fileName').value.trim();
            const category = document.getElementById('shortcutCategory').value.trim() || 'Geral';
            const isFav = document.getElementById('shortcutFavorite').checked;

            if (!title || !file) return;

            htmlFiles.push({
                id: generateUniqueId(),
                title, name: title, file, category, customIcon: '',
                visitCount: 0, isFavorite: isFav
            });
            saveToStorage();
            closeModal();
            render();
        }

        function exportBackup() {
            const backupPayload = {
                shortcuts: htmlFiles,
                categories: categoryCustomizations,
                viewModes: categoryViewModes
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "links_backup.json");
            dlAnchorElem.click();
        }

        function triggerImportBackup() { document.getElementById('importFileInput').click(); }
        
        function handleImportBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    let incoming = Array.isArray(imported) ? imported : (imported.shortcuts || []);
                    incoming.forEach(newItem => {
                        htmlFiles.push({
                            id: generateUniqueId(),
                            ...newItem,
                            visitCount: newItem.visitCount || 0,
                            isFavorite: newItem.isFavorite || false
                        });
                    });
                    saveToStorage(true);
                    render();
                    alert('Backup importado e sincronizado com sucesso!');
                } catch(err) { alert('Erro ao ler arquivo.'); }
            };
            reader.readAsText(file);
        }

        function confirmClearAllShortcuts() {
            if(confirm('Tem certeza que deseja apagar todos os atalhos?')) {
                htmlFiles = [];
                saveToStorage();
                render();
            }
        }

        function render() {
            renderCategories();
            renderGrid();
        }

        window.onload = async function() {
            render();
            await syncFromGoogleSheets();
        };
    </script>
</body>
</html>
